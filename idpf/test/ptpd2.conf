# /usr/local/etc/ptpd2.conf
ptpengine:interface=idpf0
ptpengine:preset=masteronly

# Better clock properties
ptpengine:clock_class=127
ptpengine:ptp_timescale=PTP
ptpengine:ptp_timesource=NTP
ptpengine:utc_offset=37
ptpengine:utc_offset_valid=Y
ptpengine:time_traceable=Y
ptpengine:frequency_traceable=Y
ptpengine:ptp_clock_accuracy=ACC_1US

# Status monitoring
global:log_status=Y
global:status_file=/var/run/ptpd2.status
global:status_update_interval=1
global:log_statistics=Y
global:statistics_file=/var/log/ptpd2.stats